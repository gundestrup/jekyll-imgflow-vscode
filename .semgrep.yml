# Semgrep local rules for jekyll-imgflow-vscode
# https://semgrep.dev/docs/
#
# CI runs `semgrep ci` with the Pro engine via SEMGREP_APP_TOKEN,
# using rules configured on the Semgrep App Policies page.
# These local rules are for manual/local scanning only:
#   semgrep scan --config .semgrep.yml --error src/
#
# Keep these rules in sync with the Policies page at semgrep.dev
# so CI and local scans report the same findings.

rules:
  # Detect use of eval — dangerous dynamic code execution.
  - id: ts-eval-usage
    languages: [javascript, typescript]
    severity: ERROR
    message: "Use of eval() is dangerous — avoid dynamic code execution"
    pattern: eval($VAR)
    metadata:
      owasp: "A03:2021 - Injection"
      cwe: "CWE-95: Code Injection"

  # Detect RegExp with unanchored polynomial pattern (ReDoS).
  - id: ts-redos-regex
    languages: [javascript, typescript]
    severity: WARNING
    message: "RegExp with unanchored polynomial pattern may cause ReDoS"
    pattern: new RegExp($REGEX)
    metavariable-analysis:
      analyzer: redos
      metavariable: $REGEX

  # Detect command injection via child_process exec with variable input.
  - id: ts-command-injection-exec
    languages: [javascript, typescript]
    severity: ERROR
    message: "child_process.exec with variable input — potential command injection"
    pattern-either:
      - pattern: child_process.exec($CMD)
      - pattern: require("child_process").exec($CMD)
      - pattern: import("child_process").exec($CMD)
    metadata:
      owasp: "A03:2021 - Injection"
      cwe: "CWE-78: OS Command Injection"

  # Detect prototype pollution via assignment to __proto__.
  - id: ts-prototype-pollution
    languages: [javascript, typescript]
    severity: ERROR
    message: "Assignment to __proto__ — potential prototype pollution"
    pattern-either:
      - pattern: $OBJ.__proto__ = $VAL
      - pattern: $OBJ["__proto__"] = $VAL
      - pattern: $OBJ.constructor.prototype = $VAL
    metadata:
      cwe: "CWE-1321: Prototype Pollution"
