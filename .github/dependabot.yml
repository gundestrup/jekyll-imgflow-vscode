version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # Must match the engines.vscode minimum in package.json.
      - dependency-name: "@types/vscode"
      # Mocha 12 is ESM-only; the compiled EDH harness uses CommonJS.
      - dependency-name: "mocha"
        versions: [">= 12.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
