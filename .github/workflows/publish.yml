name: Publish to Open VSX

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        vscode-version: ['1.91.0', stable]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run VS Code integration tests
        env:
          VSCODE_VERSION: ${{ matrix.vscode-version }}
        run: xvfb-run -a npm run test:integration

  publish:
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: Verify source and dependencies
        run: npm run verify

      - name: Package extension
        run: npm run package

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "Jekyll ImgFlow ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi

      - name: Verify CHANGELOG has an entry for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -q "## \[${VERSION}\]" CHANGELOG.md; then
            echo "❌ CHANGELOG.md has no '## [${VERSION}]' entry"
            exit 1
          fi
          echo "✅ CHANGELOG.md has an entry for version ${VERSION}"

      - name: Publish to Open VSX
        run: npx ovsx@1.1.1 publish jekyll-imgflow-*.vsix -p ${{ secrets.OVSX_PAT }}
