name: Publish to Open VSX

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Package extension
        run: npm run package

      - name: Publish to Open VSX
        run: npx ovsx@1.1.1 publish jekyll-imgflow-*.vsix -p ${{ secrets.OVSX_PAT }}
