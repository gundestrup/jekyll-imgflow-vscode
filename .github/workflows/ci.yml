name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source and dependencies
        run: npm run verify

      - name: Package extension
        run: npm run package

  integration:
    strategy:
      fail-fast: false
      matrix:
        vscode-version: ['1.91.0', stable]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run VS Code integration tests
        env:
          VSCODE_VERSION: ${{ matrix.vscode-version }}
        run: npm run test:integration
