# SonarQube Cloud configuration (CI-based analysis via GitHub Actions).
sonar.organization=gundestrup
sonar.projectKey=gundestrup_jekyll-imgflow-vscode
sonar.projectName=jekyll-imgflow-vscode

sonar.sources=.
sonar.test.inclusions=test/**
sonar.exclusions=node_modules/**,out/**,coverage/**,.vscode-test/**,.vsix-readme/**,*.vsix

# lcov reports uploaded as artifacts by the verify and integration jobs
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage/integration/lcov.info
